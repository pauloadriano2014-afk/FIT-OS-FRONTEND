<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- 🔥 OPEN GRAPH — controla a prévia de link no WhatsApp, Instagram, etc.
         Antes não existia NENHUMA tag og:image, então o WhatsApp caía de
         fallback pros ícones de PWA abaixo (que eram a logo do leão). -->
    <meta property="og:title" content="Paulo Adriano Team" />
    <meta property="og:description" content="Consultoria de Performance — PA Elite Team" />
    <meta property="og:image" content="https://www.pauloadrianoteam.com.br/og-image.png" />
    <meta property="og:url" content="https://www.pauloadrianoteam.com.br" />
    <meta property="og:type" content="website" />

    <!-- Twitter também lê essas tags como fallback em alguns apps -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.pauloadrianoteam.com.br/og-image.png" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png" />
    <meta name="theme-color" content="#000000" />

    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
